<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trade - Karma Street</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --bg-primary: #09090b;
      --bg-card: #111114;
      --bg-hover: #18181b;
      --border: #27272a;
      --text: #ffffff;
      --text-secondary: #a1a1aa;
      --text-muted: #71717a;
      --accent: #ff4500;
      --profit: #10b981;
      --loss: #ef4444;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 70px;
    }
    
    .container { max-width: 600px; margin: 0 auto; padding: 16px; }
    
    /* Header */
    .header {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .back-btn {
      padding: 8px 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 13px;
    }
    .header-status {
      margin-left: auto;
      display: flex; align-items: center; gap: 6px;
      padding: 6px 10px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 12px; color: var(--text-secondary);
    }
    .status-dot {
      width: 6px; height: 6px;
      background: var(--profit);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    
    /* Stock Header */
    .stock-header {
      display: flex; align-items: center; gap: 14px;
      margin-bottom: 16px;
    }
    .stock-icon {
      width: 52px; height: 52px;
      background: linear-gradient(135deg, var(--accent), #ff6b35);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-weight: bold; font-size: 22px; color: white;
    }
    .stock-title { flex: 1; }
    .stock-name-row {
      display: flex; align-items: center; gap: 4px;
      margin-bottom: 4px;
    }
    .stock-name-row span { font-size: 20px; font-weight: 700; }
    .stock-name-input {
      background: transparent; border: none; outline: none;
      font-size: 20px; font-weight: 700; color: var(--text);
      width: 150px;
    }
    .price-row { display: flex; align-items: center; gap: 10px; }
    #current-price {
      font-size: 26px; font-weight: 700;
      font-family: 'SF Mono', monospace;
    }
    #price-change {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 13px; font-weight: 600;
    }
    .price-up { background: rgba(16, 185, 129, 0.2); color: var(--profit); }
    .price-down { background: rgba(239, 68, 68, 0.2); color: var(--loss); }
    
    #message { font-size: 12px; color: var(--text-muted); margin-top: 8px; }
    
    /* Chart */
    #chart-container {
      height: 200px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
    }
    
    /* Metrics */
    .metrics {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
      margin-bottom: 16px;
    }
    .metric {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
    }
    .metric-label { font-size: 10px; color: var(--text-muted); margin-bottom: 4px; }
    .metric-value {
      font-size: 16px; font-weight: 700;
      font-family: 'SF Mono', monospace;
    }
    
    /* Trade Panel */
    .trade-panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .panel-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 14px;
    }
    .panel-header h3 { font-size: 15px; font-weight: 600; }
    .balance { font-size: 13px; color: var(--text-secondary); }
    .balance span { color: var(--text); font-weight: 600; font-family: 'SF Mono', monospace; }
    
    .input-group { margin-bottom: 12px; }
    .input-label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
    .input-field {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg-hover);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 16px;
      font-family: 'SF Mono', monospace;
    }
    .input-field:focus { outline: none; border-color: var(--accent); }
    
    .quick-amounts {
      display: flex; gap: 8px;
      margin-bottom: 12px;
    }
    .quick-btn {
      flex: 1;
      padding: 10px;
      background: var(--bg-hover);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-secondary);
      font-size: 13px; font-weight: 500;
      cursor: pointer;
    }
    .quick-btn:active { background: var(--border); }
    
    .order-summary {
      background: var(--bg-hover);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .order-row {
      display: flex; justify-content: space-between;
      font-size: 13px;
      margin-bottom: 6px;
    }
    .order-row:last-child { margin-bottom: 0; }
    .order-row span:first-child { color: var(--text-muted); }
    .order-row span:last-child { font-family: 'SF Mono', monospace; }
    .order-total {
      border-top: 1px solid var(--border);
      padding-top: 8px; margin-top: 8px;
      font-weight: 600;
    }
    
    .trade-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn {
      padding: 14px;
      border: none; border-radius: 10px;
      font-size: 15px; font-weight: 700;
      color: white;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:active { opacity: 0.8; }
    .btn-buy { background: var(--profit); }
    .btn-sell { background: var(--loss); }
    
    /* History */
    .history {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }
    .history h3 { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
    .history-table { width: 100%; }
    .history-table th {
      text-align: left;
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 500;
      padding-bottom: 8px;
      text-transform: uppercase;
    }
    .history-table td {
      padding: 8px 0;
      font-size: 12px;
      border-top: 1px solid var(--border);
    }
    .history-empty {
      text-align: center;
      padding: 24px;
      color: var(--text-muted);
      font-size: 13px;
    }
    
    /* Bottom Nav */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #0c0c0f;
      border-top: 1px solid var(--border);
      padding: 10px 0;
      display: flex; justify-content: center; gap: 32px;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      text-decoration: none;
      color: var(--text-muted);
      font-size: 10px;
    }
    .nav-item.active { color: var(--accent); }
    .nav-item span:first-child { font-size: 20px; }
  </style>
  <script src="chart.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <a href="market.html" class="back-btn">← Market</a>
      <div class="header-status">
        <div class="status-dot"></div>
        <span>Live</span>
      </div>
    </header>

    <!-- Stock Header -->
    <div class="stock-header">
      <div id="subreddit-icon" class="stock-icon">R</div>
      <div class="stock-title">
        <div class="stock-name-row">
          <span>r/</span>
          <input type="text" id="subreddit" class="stock-name-input" list="subreddit-list" placeholder="Select sub" />
          <datalist id="subreddit-list"></datalist>
        </div>
        <div class="price-row">
          <span id="current-price">$0.00</span>
          <span id="price-change" class="price-up">+0.0%</span>
        </div>
      </div>
    </div>
    <p id="message">Connecting to Karma Street...</p>

    <!-- Chart -->
    <div id="chart-container"></div>

    <!-- Metrics -->
    <div class="metrics">
      <div class="metric">
        <div class="metric-label">Karma</div>
        <div id="metric-karma" class="metric-value">—</div>
      </div>
      <div class="metric">
        <div class="metric-label">Posts</div>
        <div id="metric-posts" class="metric-value">—</div>
      </div>
      <div class="metric">
        <div class="metric-label">Comments</div>
        <div id="metric-comments" class="metric-value">—</div>
      </div>
    </div>

    <!-- Trade Panel -->
    <div class="trade-panel">
      <div class="panel-header">
        <h3>Trade</h3>
        <div class="balance">Balance: <span id="capital-display">$50,000</span></div>
      </div>
      
      <div class="input-group">
        <label class="input-label">Amount (shares)</label>
        <input type="number" id="amount" class="input-field" min="1" placeholder="0" />
      </div>
      
      <div class="quick-amounts">
        <button class="quick-btn" onclick="setAmount(10)">10</button>
        <button class="quick-btn" onclick="setAmount(25)">25</button>
        <button class="quick-btn" onclick="setAmount(50)">50</button>
        <button class="quick-btn" onclick="setAmount(100)">100</button>
      </div>
      
      <div class="order-summary">
        <div class="order-row">
          <span>Price per share</span>
          <span id="order-price">$0.00</span>
        </div>
        <div class="order-row">
          <span>Quantity</span>
          <span id="order-qty">0</span>
        </div>
        <div class="order-row order-total">
          <span>Total</span>
          <span id="order-total">$0.00</span>
        </div>
      </div>
      
      <div class="trade-buttons">
        <button id="buyStock" class="btn btn-buy">Buy</button>
        <button id="sellStock" class="btn btn-sell">Sell</button>
      </div>
    </div>

    <!-- Trade History -->
    <div class="history">
      <h3>Recent Trades</h3>
      <table class="history-table">
        <thead>
          <tr>
            <th>Type</th>
            <th>Sub</th>
            <th>Qty</th>
            <th>Price</th>
            <th>Total</th>
          </tr>
        </thead>
        <tbody id="trade-history-data">
          <tr>
            <td colspan="5" class="history-empty">No trades yet</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="page.html" class="nav-item">
      <span>🏠</span>
      <span>Home</span>
    </a>
    <a href="market.html" class="nav-item">
      <span>📈</span>
      <span>Market</span>
    </a>
    <a href="portfolio.html" class="nav-item">
      <span>💼</span>
      <span>Portfolio</span>
    </a>
  </nav>

  <script>
    function setAmount(val) {
      document.getElementById('amount').value = val;
      document.getElementById('amount').dispatchEvent(new Event('input'));
    }
  </script>
</body>
</html>
