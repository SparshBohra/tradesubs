<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Karma Street Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>Karma Street Dashboard</h1>
      <div class="stats-box">
        <h2>Welcome, <span id="username">Guest</span>!</h2>
        <p id="message">Connecting to Karma Street...</p>
      </div>

      <div class="trading-form">
        <h3>Trade Stocks</h3>
        <div class="form-group">
          <label for="subreddit">Subreddit:</label>
          <input
            list="subreddit-list"
            id="subreddit"
            placeholder="Select or type subreddit"
          />
          <datalist id="subreddit-list">
            <!-- Will be populated by JavaScript -->
          </datalist>
        </div>
        <div class="form-group">
          <label for="amount">Amount:</label>
          <input type="number" id="amount" placeholder="Enter amount" min="1" />
        </div>
        <div class="action-buttons">
          <button id="buyStock">Buy Stock</button>
          <button id="sellStock">Sell Stock</button>
        </div>
        <div id="stock-info" class="stock-info">
          <!-- Stock data will be displayed here -->
        </div>
      </div>

      <div class="portfolio-summary">
        <h3>Portfolio Summary</h3>
        <div id="portfolio-data">Loading portfolio data...</div>
      </div>

      <div class="trade-history">
        <h3>Trade History</h3>
        <div id="trade-history-data"></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
