<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Portfolio - Karma Street</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <!-- Chart Setup -->
  <script>
    const raw = localStorage.getItem("portfolio");
    const portfolio = raw ? JSON.parse(raw) : {};

    const portfolioList = document.getElementById("portfolio-list");
    const noDataMessage = document.getElementById("noDataMessage");
    const ctx = document.getElementById("portfolioChart").getContext("2d");

    if (Object.keys(portfolio).length > 0) {
      portfolioList.innerHTML = Object.entries(portfolio)
        .map(([subreddit, amount]) => `<div>${subreddit}: ${amount} shares</div>`)
        .join("");

      const labels = Object.keys(portfolio);
      const data = Object.values(portfolio);

      new Chart(ctx, {
        type: "pie",
        data: {
          labels,
          datasets: [{
            label: "Your Portfolio Distribution",
            data,
            backgroundColor: [
              "#FF6384", "#36A2EB", "#FFCE56", "#4BC0C0",
              "#9966FF", "#FF9F40", "#76B041", "#FF6B6B"
            ],
            borderWidth: 1,
          }],
        },
        options: {
          responsive: true,
          plugins: {
            legend: {
              position: "bottom",
            },
          },
        },
      });
    } else {
      noDataMessage.innerText = "No holdings yet to show a distribution chart.";
    }
  </script>

    <div class="container">
      <div class="portfolio-header">
        <div class="header-left">
          <div class="logo">
            <div class="logo-icon">K</div>
            <span>Karma Street</span>
          </div>
        </div>
        <a href="page.html" class="back-link">← Home</a>
      </div>

      <div class="portfolio-summary">
        <div class="total-value">
          <h1 id="portfolio-value">$0.00</h1>
          <div class="value-change positive" id="portfolio-change">
            +$0.00 (0%)
          </div>
        </div>
        <div id="available-capital" class="value-display"></div>
      </div>

      <!-- <div class="chart-section">
        <canvas id="portfolioChart" width="400" height="400"></canvas>
        <div id="noDataMessage" style="text-align:center; color: #aaa;"></div>
      </div> -->

      <div class="holdings-section">
        <h2>Your Holdings</h2>
        <table class="holdings-table">
          <thead>
            <tr>
              <th>Subreddit</th>
              <th>Qty</th>
              <th>Avg Price</th>
              <th>Current Value</th>
              <th>P&L</th>
            </tr>
          </thead>
          <tbody id="portfolio-data">
            <!-- Will be populated by JavaScript -->
          </tbody>
        </table>
      </div>

      <div class="transactions-section">
        <h2>Recent Transactions</h2>
        <table class="transactions-table">
          <thead>
            <tr>
              <th>Type</th>
              <th>Subreddit</th>
              <th>Amount</th>
              <th>Price</th>
              <th>Total</th>
              <th>Time</th>
            </tr>
          </thead>
          <tbody id="trade-history-data">
            <!-- Will be populated by JavaScript -->
          </tbody>
        </table>
      </div>
    </div>

    <nav class="bottom-nav">
      <a href="page.html" class="nav-item">
        <span>Home</span>
      </a>
      <a href="market.html" class="nav-item">
        <span>Market</span>
      </a>
      <a href="portfolio.html" class="nav-item">
        <span>Portfolio</span>
      </a>
      </a>
    </nav>
  </body>
</html>
